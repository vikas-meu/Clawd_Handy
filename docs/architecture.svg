<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #1c1b19; stroke: #3a3936; stroke-width: 2; }
    .hot { stroke: #d97757; }
    .title { fill: #faf9f5; font-size: 17px; font-weight: 700; }
    .sub { fill: #d97757; font-size: 12px; font-weight: 600; letter-spacing: .5px; }
    .item { fill: #b9b7b0; font-size: 12.5px; }
    .label { fill: #8a8a8a; font-size: 11.5px; }
    .wire { fill: none; stroke: #3a3936; stroke-width: 2.5; stroke-dasharray: 6 6; }
    .flow { animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .spin { transform-origin: 82px 238px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 2.4s steps(1) infinite; }
    @keyframes blink { 0%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }
  </style>
  <rect width="960" height="520" rx="18" fill="#141413"/>

  <!-- wires -->
  <path id="w1" class="wire flow" d="M262 225 C 330 225, 320 120, 382 120"/>
  <path id="w2" class="wire flow" d="M602 96 L 718 96"/>
  <path id="w2b" class="wire flow" d="M718 140 L 602 140"/>
  <path id="w3" class="wire flow" d="M262 300 C 330 300, 320 400, 382 400"/>
  <path id="w4" class="wire flow" d="M150 398 L 150 342"/>

  <!-- packets: orange = request, cream = answer -->
  <circle r="6" fill="#d97757"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
  <circle r="6" fill="#faf9f5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w1"/></animateMotion></circle>
  <circle r="6" fill="#d97757"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  <circle r="6" fill="#faf9f5"><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#w2b"/></animateMotion></circle>
  <circle r="6" fill="#d97757"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
  <circle r="6" fill="#faf9f5"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w3"/></animateMotion></circle>
  <circle r="5" fill="#5ba3f8"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>

  <text class="label" x="270" y="160">usage, photos, frames</text>
  <text class="label" x="270" y="176">LAN / HTTP :8765</text>
  <text class="label" x="612" y="86">HTTPS</text>
  <text class="label" x="612" y="160">%, answers</text>
  <text class="label" x="270" y="378">HTTPS, no keys</text>
  <text class="label" x="160" y="376">web remote :80</text>

  <!-- the board -->
  <rect class="box hot" x="40" y="190" width="222" height="150" rx="14"/>
  <rect x="58" y="212" width="48" height="48" rx="4" fill="#0d0d0c" stroke="#3a3936"/>
  <g class="spin" fill="#d97757">
    <rect x="80" y="220" width="4" height="36" rx="2"/>
    <rect x="80" y="220" width="4" height="36" rx="2" transform="rotate(30 82 238)"/>
    <rect x="80" y="220" width="4" height="36" rx="2" transform="rotate(60 82 238)"/>
    <rect x="80" y="220" width="4" height="36" rx="2" transform="rotate(90 82 238)"/>
    <rect x="80" y="220" width="4" height="36" rx="2" transform="rotate(120 82 238)"/>
    <rect x="80" y="220" width="4" height="36" rx="2" transform="rotate(150 82 238)"/>
  </g>
  <text class="title" x="118" y="226">MEMENTO</text>
  <text class="sub" x="118" y="244">ESP32-S3 + CAMERA</text>
  <text class="item" x="58" y="282">Usage · Ask · Dance · Pet</text>
  <text class="item" x="58" y="300">Alarms · Games · World Live</text>
  <text class="item" x="58" y="318">Toolbox · Idle clock</text>

  <!-- your PC -->
  <rect class="box" x="382" y="30" width="220" height="170" rx="14"/>
  <text class="title" x="400" y="60">Your PC</text>
  <text class="sub" x="400" y="78">claude_bridge.py</text>
  <text class="item" x="400" y="104">• plan usage from your</text>
  <text class="item" x="412" y="120">Claude Code login</text>
  <text class="item" x="400" y="140">• asks Claude about photos</text>
  <text class="item" x="400" y="160">• OpenCV: faces + QR codes</text>
  <text class="item" x="400" y="180">• answers LAN discovery</text>

  <!-- Anthropic -->
  <rect class="box" x="718" y="30" width="212" height="170" rx="14"/>
  <text class="title" x="736" y="60">Anthropic</text>
  <text class="sub" x="736" y="78">API.ANTHROPIC.COM</text>
  <text class="item" x="736" y="108">• usage (5 h session,</text>
  <text class="item" x="748" y="124">7 day weekly)</text>
  <text class="item" x="736" y="148">• Messages API:</text>
  <text class="item" x="748" y="164">Claude reads the photo,</text>
  <text class="item" x="748" y="180">replies in &lt; 35 words</text>

  <!-- free web data -->
  <rect class="box" x="382" y="330" width="220" height="150" rx="14"/>
  <text class="title" x="400" y="360">Free web data</text>
  <text class="sub" x="400" y="378">STRAIGHT FROM THE BOARD</text>
  <text class="item" x="400" y="404">Open-Meteo · OpenSky</text>
  <text class="item" x="400" y="422">wheretheiss.at · USGS</text>
  <text class="item" x="400" y="440">CoinGecko · ipwho.is</text>
  <text class="item" x="400" y="462">+ NTP internet time</text>

  <!-- phone -->
  <rect class="box" x="70" y="398" width="160" height="92" rx="14"/>
  <rect x="88" y="414" width="30" height="58" rx="6" fill="none" stroke="#5ba3f8" stroke-width="2"/>
  <circle class="blink" cx="103" cy="464" r="2.5" fill="#5ba3f8"/>
  <text class="title" x="128" y="436">Phone</text>
  <text class="item" x="128" y="456">clawd.local</text>

  <!-- legend -->
  <circle cx="660" cy="430" r="6" fill="#d97757"/><text class="label" x="672" y="434">request</text>
  <circle cx="660" cy="452" r="6" fill="#faf9f5"/><text class="label" x="672" y="456">answer</text>
  <circle cx="660" cy="474" r="5" fill="#5ba3f8"/><text class="label" x="672" y="478">your phone</text>
  <text class="label" x="760" y="434">Usage, Ask, faces and QR</text>
  <text class="label" x="760" y="452">go through the PC bridge;</text>
  <text class="label" x="760" y="470">everything else needs</text>
  <text class="label" x="760" y="488">only WiFi.</text>
</svg>
